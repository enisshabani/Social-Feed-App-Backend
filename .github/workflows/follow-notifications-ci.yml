name: Follow and Notifications Backend CI

on:
  push:
    branches: [main, master]
    paths:
      - "app/modules/follows/**"
      - "app/modules/notifications/**"
      - "app/models/notification_preference.py"
      - "app/workers/notification_worker.py"
      - "tests/test_follows*.py"
      - "tests/test_notifications*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/follow-notifications-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/modules/follows/**"
      - "app/modules/notifications/**"
      - "app/models/notification_preference.py"
      - "app/workers/notification_worker.py"
      - "tests/test_follows*.py"
      - "tests/test_notifications*.py"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/follow-notifications-ci.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint follow and notifications modules
        run: ruff check app/modules/follows app/modules/notifications tests/test_follows.py tests/test_follows_api.py tests/test_notifications.py tests/test_notifications_service.py

      - name: Run unit and API tests
        env:
          REDIS_URL: redis://localhost:6379/0
        run: pytest tests/test_follows.py tests/test_follows_api.py tests/test_notifications.py tests/test_notifications_service.py
